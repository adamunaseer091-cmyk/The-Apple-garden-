<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6b3a">
  <meta name="description" content="Apple Garden - Quality seedlings and fruit plants in Nigeria">
  <title>Apple Garden | Seedling Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8f4;
      color: #17351f;
    }

    header {
      background: linear-gradient(135deg, #174d2a, #2f7d46);
      color: white;
      padding: 18px 18px 24px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 27px;
    }

    .brand h1 {
      font-size: 21px;
    }

    .brand small {
      opacity: .85;
    }

    .cart {
      background: white;
      color: #174d2a;
      border: 0;
      border-radius: 25px;
      padding: 10px 15px;
      font-weight: 700;
      font-size: 15px;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 30px 18px 5px;
    }

    .hero h2 {
      font-size: 30px;
      line-height: 1.15;
      margin-bottom: 9px;
    }

    .hero p {
      opacity: .9;
    }

    .search-area {
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 0 18px;
    }

    .search {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px 100px;
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 18px;
    }

    .category {
      border: 1px solid #cdd8ce;
      background: white;
      border-radius: 25px;
      padding: 10px 15px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active {
      background: #1f6b3a;
      color: white;
      border-color: #1f6b3a;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(24,55,32,.08);
    }

    .product-image {
      height: 170px;
      background: linear-gradient(135deg, #dcebd9, #edf5e9);
      display: grid;
      place-items: center;
      font-size: 65px;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .description {
      color: #647166;
      font-size: 13px;
      min-height: 38px;
      margin-bottom: 10px;
    }

    .price {
      color: #1f6b3a;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .add {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 12px;
      background: #1f6b3a;
      color: white;
      font-weight: 700;
      font-size: 15px;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #667066;
    }

    .cart-panel {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 50;
      display: none;
      align-items: flex-end;
    }

    .cart-panel.show {
      display: flex;
    }

    .cart-box {
      background: white;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 24px 24px 0 0;
      padding: 22px;
    }

    .cart-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .close {
      border: 0;
      background: #eef2ee;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 18px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #e7ebe7;
    }

    .qty button {
      border: 0;
      background: #e7efe8;
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .checkout {
      margin-top: 20px;
    }

    .checkout input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5cd;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
      margin: 18px 0;
    }

    .whatsapp {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 12px;
      background: #1f9d55;
      color: white;
      font-weight: 800;
      font-size: 16px;
    }

    footer {
      background: #17351f;
      color: white;
      padding: 28px 18px;
      text-align: center;
    }

    @media (min-width: 700px) {
      .hero h2 {
        font-size: 42px;
      }

      .cart-panel {
        align-items: center;
        justify-content: center;
      }

      .cart-box {
        max-width: 550px;
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="brand">
      <div class="logo">🌱</div>
      <div>
        <h1>The Apple Garden</h1>
        <small>Quality seedlings & fruit plants</small>
      </div>
    </div>

    <button class="cart" onclick="openCart()">
      🛒 Cart <span id="cartCount">0</span>
    </button>
  </div>

  <div class="hero">
    <h2>Grow something beautiful.</h2>
    <p>Shop quality seedlings for your farm, garden and orchard.</p>
  </div>

  <div class="search-area">
    <input
      class="search"
      id="search"
      placeholder="🔎 Search seedlings..."
      oninput="renderProducts()"
    >
  </div>
</header>

<main>

  <div class="categories">
    <button class="category active" onclick="setCategory('All', this)">All</button>
    <button class="category" onclick="setCategory('Fruit', this)">🍎 Fruit Plants</button>
    <button class="category" onclick="setCategory('Grape', this)">🍇 Grapes</button>
    <button class="category" onclick="setCategory('Ornamental', this)">🌸 Ornamental</button>
  </div>

  <section class="products" id="products"></section>

</main>

<footer>
  <h3>The Apple Garden 🪴</h3>
  <p style="margin-top:8px;">Quality seedlings for a greener future.</p>
  <p style="margin-top:8px;">📍 Kaduna State, Nigeria</p>
</footer>

<div class="cart-panel" id="cartPanel">
  <div class="cart-box">

    <div class="cart-head">
      <h2>Your Cart</h2>
      <button class="close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">₦0</span>
    </div>

    <div class="checkout">
      <h3 style="margin-bottom:12px;">Customer Details</h3>

      <input id="customerName" placeholder="Full name">
      <input id="customerPhone" placeholder="Phone number">
      <input id="customerAddress" placeholder="Delivery location">

      <button class="whatsapp" onclick="orderWhatsApp()">
        Order through WhatsApp
      </button>
    </div>

  </div>
</div>

<script>

const WHATSAPP_NUMBER = "2349132048135";

const products = [
  {
    id: 1,
    name: "Apple Seedling",
    price: 13000,
    category: "Fruit",
    emoji: "🍎",
    description: "Quality apple seedling suitable for orchard establishment."
  },

  {
    id: 2,
    name: "Grape Seedling",
    price: 0,
    category: "Grape",
    emoji: "🍇",
    description: "Healthy grape seedling. Contact us for current price."
  },

  {
    id: 3,
    name: "Fruit Plant",
    price: 0,
    category: "Fruit",
    emoji: "🌱",
    description: "Quality fruit plant. Contact us for available varieties."
  },

  {
    id: 4,
    name: "Ornamental Plant",
    price: 0,
    category: "Ornamental",
    emoji: "🌸",
    description: "Beautiful plants for gardens and landscaping."
  }
];

let cart = [];
let selectedCategory = "All";

function money(value) {
  if (value === 0) return "Contact for price";
  return "₦" + value.toLocaleString("en-NG");
}

function setCategory(category, button) {
  selectedCategory = category;

  document.querySelectorAll(".category").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");
  renderProducts();
}

function renderProducts() {

  const search = document
    .getElementById("search")
    .value
    .toLowerCase();

  const list = products.filter(product => {

    const categoryMatch =
      selectedCategory === "All" ||
      product.category === selectedCategory;

    const searchMatch =
      product.name.toLowerCase().includes(search) ||
      product.description.toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  const container = document.getElementById("products");

  if (!list.length) {
    container.innerHTML =
      '<div class="empty">No seedlings found.</div>';
    return;
  }

  container.innerHTML = list.map(product => `

    <article class="product">

      <div class="product-image">
        ${product.emoji}
      </div>

      <div class="product-info">

        <h3>${product.name}</h3>

        <p class="description">
          ${product.description}
        </p>

        <div class="price">
          ${money(product.price)}
        </div>

        <button
          class="add"
          onclick="addToCart(${product.id})"
        >
          Add to Cart
        </button>

      </div>

    </article>

  `).join("");
}

function addToCart(id) {

  const product = products.find(p => p.id === id);

  const existing = cart.find(item => item.id === id);

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      ...product,
      quantity: 1
    });
  }

  updateCart();
  openCart();
}

function changeQuantity(id, amount) {

  const item = cart.find(p => p.id === id);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(p => p.id !== id);
  }

  updateCart();
}

function updateCart() {

  const count = cart.reduce(
    (sum, item) => sum + item.quantity,
    0
  );

  document.getElementById("cartCount").textContent = count;

  const container = document.getElementById("cartItems");

  if (!cart.length) {
    container.innerHTML =
      '<p style="text-align:center;padding:30px;">Your cart is empty.</p>';

    document.getElementById("cartTotal").textContent = "₦0";
    return;
  }

  container.innerHTML = cart.map(item => `

    <div class="cart-item">

      <div>
        <strong>${item.emoji} ${item.name}</strong>
        <div style="color:#667066;margin-top:4px;">
          ${item.price ? money(item.price) : "Price to be confirmed"}
        </div>
      </div>

      <div class="qty">
        <button onclick="changeQuantity(${item.id}, -1)">−</button>
        <strong style="padding:0 8px;">${item.quantity}</strong>
        <button onclick="changeQuantity(${item.id}, 1)">+</button>
      </div>

    </div>

  `).join("");

  const total = cart.reduce(
    (sum, item) => sum + (item.price * item.quantity),
    0
  );

  const hasPriceToConfirm = cart.some(item => item.price === 0);

  document.getElementById("cartTotal").textContent =
    hasPriceToConfirm
      ? money(total) + " + items to confirm"
      : money(total);
}

function openCart() {
  document.getElementById("cartPanel").classList.add("show");
}

function closeCart() {
  document.getElementById("cartPanel").classList.remove("show");
}

function orderWhatsApp() {

  if (!cart.length) {
    alert("Your cart is empty.");
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  if (!name || !phone || !address) {
    alert("Please enter your name, phone number and delivery location.");
    return;
  }

  let message =
    "Hello The Apple Garden 🌱%0A%0A" +
    "I want to place an order.%0A%0A" +
    "Customer: " + encodeURIComponent(name) + "%0A" +
    "Phone: " + encodeURIComponent(phone) + "%0A" +
    "Location: " + encodeURIComponent(address) + "%0A%0A" +
    "ORDER:%0A";

  cart.forEach(item => {

    message +=
      encodeURIComponent(
        item.name +
        " × " +
        item.quantity +
        " — " +
        (item.price ? money(item.price) : "Price to confirm")
      ) +
      "%0A";

  });

  const total = cart.reduce(
    (sum, item) => sum + (item.price * item.quantity),
    0
  );

  message +=
    "%0ATotal shown: " +
    encodeURIComponent(money(total));

  window.open(
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    message,
    "_blank"
  );
}

renderProducts();
updateCart();

</script>

</body>
</html>
